# Fast, format-level only — heavy checks (ty, clippy, tests) belong to CI.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with ruff in uv.lock, which is what CI's `just lint` runs.
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        # Blocks accidental fixture bloat; golden masters are added
        # deliberately via `git add -f` paths documented in CONTRIBUTING.
        args: [--maxkb=600]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      # Statically checks .github/workflows/: expression types, action
      # inputs, job refs, plus shellcheck over run: blocks. Cheap insurance
      # for wheels.yml, whose jobs otherwise only execute on a tag push.
      - id: actionlint
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
